name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  plan-destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      GHA_CLIENT_ID: ${{ secrets.GHA_CLIENT_ID }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./
        run: terraform init

      - name: Terraform Plan Destroy
        working-directory: ./
        run: terraform plan -destroy -out=tfplan -var="gha_client_id=${GHA_CLIENT_ID}"

  destroy:
    runs-on: ubuntu-latest
    needs: plan-destroy
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      GHA_CLIENT_ID: ${{ secrets.GHA_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./
        run: terraform init

      - name: Terraform Destroy
        working-directory: ./
        run: terraform destroy -auto-approve -var="gha_client_id=${GHA_CLIENT_ID}"
