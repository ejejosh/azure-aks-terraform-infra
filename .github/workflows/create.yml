name: Terraform Create

on:
  
  workflow_dispatch:
  pull_request:
    types: [review_requested, ready_for_review, synchronize]
    branches: [ main, rollback]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/create.yaml'
  # push:
  #   branches: [main, rollback]
  #   paths:
  #     - '**/*.tf'
  #     - '**/*.tfvars'
  #     - '.github/workflows/create.yaml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      GHA_CLIENT_ID: ${{ secrets.GHA_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./
        run: |
          terraform init \
            -backend-config="resource_group_name=joshuaeje" \
            -backend-config="storage_account_name=exustfbackendstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.terraform.tfstate"

      - name: Terraform Validate
        working-directory: ./
        run: terraform validate

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      GHA_CLIENT_ID: ${{ secrets.GHA_CLIENT_ID }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./
        run: terraform init

      - name: Terraform Apply
        working-directory: ./
        run: terraform apply -auto-approve -var="gha_client_id=${GHA_CLIENT_ID}"
